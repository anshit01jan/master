# Static defaults for the single-browser local automation run.
# PR scope refresh note: comment-only touch to keep this config visible in PR #4.
baseUrl=http://127.0.0.1:5000
browser=chrome
headless=true
timeoutSeconds=10
pollingSeconds=1
reportPath=target/extent-report.html
screenshotPath=target/screenshots
notificationLogPath=target/automation/reset-notifications.log