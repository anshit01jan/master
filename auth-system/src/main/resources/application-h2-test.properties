# Server Configuration (HTTP for H2 testing - SSL disabled)
server.port=8080
server.ssl.enabled=false

# H2 Database Configuration for testing
spring.datasource.url=jdbc:h2:mem:authdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for H2 testing
spring.flyway.enabled=false

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@authsystem.local
app.reset.url=http://localhost:8080/auth/reset-password

# Application Configuration
app.security.bcrypt.strength=12
app.security.token.expiry.minutes=2
app.security.lockout.attempts=3
app.security.lockout.duration.minutes=1

# Logging
logging.level.root=INFO
logging.level.com.scrum.auth=DEBUG
logging.level.org.springframework.security=DEBUG
