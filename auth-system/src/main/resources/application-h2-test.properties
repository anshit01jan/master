# Server Configuration (HTTPS with H2 database for testing)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=authsystem

# H2 Database Configuration for testing
spring.datasource.url=jdbc:h2:mem:authdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for H2 testing
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.scrum.auth=DEBUG
logging.level.org.springframework.security=DEBUG
