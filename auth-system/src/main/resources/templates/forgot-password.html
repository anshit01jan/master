<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Access</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Access</h1>
        
        <div th:if="${message}" class="success" th:text="${message}"></div>
        
        <form method="post" th:object="${resetInitRequest}">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" th:field="*{email}" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
            </div>
            
            <button type="submit">Send Reset Link</button>
        </form>
        
        <div style="margin-top: 20px;">
            <p><a href="/auth/login">Back to Login</a></p>
        </div>
    </div>
</body>
</html>
