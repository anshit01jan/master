<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Access</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="password"] { width: 100%; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; }
        .info { font-size: 12px; color: gray; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Access</h1>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" style="color: green;" th:text="${success}"></div>
        
        <p class="info">Requirements: minimum 8 characters with at least 1 uppercase, 1 lowercase, and 1 special character</p>
        
        <form method="post" th:object="${resetRequest}">
            <input type="hidden" th:value="${token}" name="token">
            
            <div class="form-group">
                <label for="newPassword">New Value:</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" required>
                <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="error"></span>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm:</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
            </div>
            
            <button type="submit">Reset</button>
        </form>
        
        <div style="margin-top: 20px;">
            <p><a href="/auth/login">Back to Login</a></p>
        </div>
    </div>
</body>
</html>
