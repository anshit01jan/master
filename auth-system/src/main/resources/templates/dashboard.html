<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .content { margin-top: 30px; }
        button { padding: 10px 20px; background-color: #dc3545; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dashboard</h1>
            <form method="get" action="/auth/logout">
                <button type="submit">Logout</button>
            </form>
        </div>
        
        <div class="content">
            <p>Welcome, <span th:text="${session.userEmail}"></span>!</p>
            <p>You have successfully authenticated and accessed the dashboard.</p>
        </div>
    </div>
</body>
</html>
