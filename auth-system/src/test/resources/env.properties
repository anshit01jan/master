# Environment Configuration
# Format: env.{environment}.{property}

# QA Environment
env.qa.baseUrl=http://localhost:8080
env.qa.apiUrl=http://localhost:8080/api

# UAT Environment
env.uat.baseUrl=http://uat-server:8080
env.uat.apiUrl=http://uat-server:8080/api

# Staging Environment
env.staging.baseUrl=http://staging-server:8080
env.staging.apiUrl=http://staging-server:8080/api

# Production-like Environment
env.prod.baseUrl=http://prod-server:8080
env.prod.apiUrl=http://prod-server:8080/api

# Default Environment
default.env=qa
